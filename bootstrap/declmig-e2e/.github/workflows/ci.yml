name: Contract CI

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo run --quiet --manifest-path tools/verify-pins/Cargo.toml --
      - run: jq -e . contracts/runtime-ownership.json >/dev/null
      - run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - run: '! grep -RInE ''ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'' . --exclude-dir=.git'
