name: Canonical fleet drift contract

on:
  pull_request:
    paths:
      - 'docs/CANONICAL-FLEET-DRIFT.json'
      - 'docs/CANONICAL-FLEET-DRIFT.md'
      - '.github/workflows/canonical-fleet-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-fleet-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate the machine-readable reconciliation
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('docs/CANONICAL-FLEET-DRIFT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1
          assert data['auditedAt'] == '2026-08-09'
          assert data['sourceOrganization'] == 'declarative-migrations'
          assert data['testOrganization'] == 'declarative-migrations-test'
          expected = data['expectedSpecializedRepositories'] + data['expectedGovernanceRepositories']
          present = data['presentCanonicalRepositories']
          missing = data['missingCanonicalRepositories']
          assert len(present) + len(missing) == expected
          assert len(present) == len(set(present))
          assert len(missing) == len(set(missing))
          assert not set(present) & set(missing)
          assert '.github' in present
          assert set(missing) == {'cli-plan-e2e', 'postgres-zero-downtime-e2e'}

          aggregates = data['aggregatePortfolioRepositories']
          assert len(aggregates) == 2
          by_name = {item['fullName']: item for item in aggregates}
          expected_aggregates = {
              'declarative-migrations/declmig-e2e',
              'declarative-migrations-test/declmig-e2e',
          }
          assert set(by_name) == expected_aggregates
          for name in expected_aggregates:
              item = by_name[name]
              assert item['present'] is True
              assert item['bootstrapStatus'] == 'merged-main-green'
              assert item['bootstrapPullRequest'] == f'https://github.com/{name}/pull/1'
              assert re.fullmatch(r'[0-9a-f]{40}', item['mergeCommit'])
              assert isinstance(item['mainWorkflowRun'], int) and item['mainWorkflowRun'] > 0
              assert item['sourceCommit'] == '39d1d9da93127145a0d5b4d3e65bb23638f84ca9'
              assert item['engine'] == 'postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317'
              assert item['dpmBinarySha256'] == '5445759b9d243e2f34957ecb63589b3320a5741ed854d1848708efb4d0b114bc'

          assert data['policy']['preserveExtraRepositories'] is True
          assert data['policy']['neverDeleteOrOverwriteIndependentWork'] is True
          assert data['policy']['testOrganizationBeforeProductionPromotion'] is True

          raw = path.read_text(encoding='utf-8')
          for pattern in (
              r'gh[pousr]_[A-Za-z0-9]{20,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'lin_api_[A-Za-z0-9]{20,}',
              r'cfat_[A-Za-z0-9_-]{20,}',
              r'Authorization: Bearer\s+\S+',
              r'client_secret=',
              r'password=',
          ):
              assert re.search(pattern, raw, re.IGNORECASE) is None
          PY
