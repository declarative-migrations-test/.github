name: Validate declmig-e2e bootstrap

on:
  pull_request:
    paths:
      - 'architecture/DECLMIG_E2E.md'
      - 'bootstrap/declmig-e2e/**'
      - 'factory/declmig-e2e-portfolio-entry.yaml'
      - '.github/workflows/validate-declmig-e2e-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'architecture/DECLMIG_E2E.md'
      - 'bootstrap/declmig-e2e/**'
      - 'factory/declmig-e2e-portfolio-entry.yaml'
      - '.github/workflows/validate-declmig-e2e-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-declmig-e2e-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate immutable inputs and contracts
        working-directory: bootstrap/declmig-e2e
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/verify-pins/Cargo.toml --all-targets
          cargo run --quiet --manifest-path tools/verify-pins/Cargo.toml --
          jq -e . bootstrap-manifest.json >/dev/null
          jq -e . contracts/runtime-ownership.json >/dev/null
          jq -e . schemas/evidence.schema.json >/dev/null
      - name: Validate harness syntax and secret hygiene
        run: |
          set -euo pipefail
          find bootstrap/declmig-e2e/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          ! grep -RInE 'ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' bootstrap/declmig-e2e
